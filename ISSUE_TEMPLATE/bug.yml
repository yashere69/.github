name: Bug
description: Something crashed, gave a wrong result, or read a file wrongly.
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `<tool> --version`, and your OS and Python version.
      placeholder: shoplint 0.3.0, Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Smallest input that shows it
      description: >
        A few lines of the file is usually enough. Replace names, phone numbers, IDs and
        addresses first; nakli can generate safe stand-ins.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: I've removed real names, numbers and addresses from everything above.
          required: true
